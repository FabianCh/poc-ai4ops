---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
  - name: cluster-issuers
  interval: 10m0s
  path: ./manifest/base/kube-prometheus-stack
  prune: true
  wait: true
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
  # Host de l'Ingress Grafana : grafana.${INGRESS_BASE_DOMAIN}
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-vars
