apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ia4ops-agent-chat
  namespace: flux-system
spec:
  # otel-demo : le Role de lecture est créé dans ce namespace, qui doit exister
  dependsOn:
  - name: kube-prometheus-stack
  - name: otel-demo
  interval: 10m0s
  path: ./manifest/applications/ia4ops-agent-chat
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
