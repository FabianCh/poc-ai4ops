---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ia4ops-agent
  namespace: flux-system
spec:
  # Le Role de lecture est créé dans otel-demo : le namespace doit exister
  dependsOn:
  - name: otel-demo
  interval: 10m0s
  path: ./manifest/applications/ia4ops-agent
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
