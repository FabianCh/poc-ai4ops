---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-demo
  namespace: flux-system
spec:
  # Télémétrie envoyée vers Prometheus et Loki (namespace monitoring)
  dependsOn:
  - name: cluster-issuers
  - name: kube-prometheus-stack
  - name: loki
  interval: 10m0s
  path: ./manifest/applications/otel-demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: otel-demo
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-vars
