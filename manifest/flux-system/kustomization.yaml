apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- applications/
- base/
- gotk-components.yaml
- gotk-sync.yaml
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  cpu: 50m
                  memory: 200Mi
                limits:
                  cpu: null
                  memory: 200Mi
  target:
    kind: Deployment
    name: "(kustomize-controller|helm-controller|source-controller|notification-controller)"
