# Lecture seule, limitée au namespace otel-demo : uniquement get/list, pas de watch, pas
# d'écriture, ni logs de pods, ni secrets, ni configmaps. Ce Role vit dans otel-demo : le
# namespace est donc explicite ici (ni `namespace:` du kustomization, ni `targetNamespace:`
# de la Kustomization Flux ne doivent le réécrire vers ia4ops-agent-chat).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ia4ops-agent-chat-reader
  namespace: otel-demo
rules:
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
