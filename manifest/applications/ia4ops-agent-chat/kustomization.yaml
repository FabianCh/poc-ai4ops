apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pas de `namespace:` global : le Role et le RoleBinding vivent dans otel-demo ; chaque
# ressource déclare son namespace.
images:
# v1 figée (tag Git ia4ops-agent-chat-v1) pendant le développement de l'agent N0 sur la branche
# feature/agent-n0 : image du 19/10 (empreinte sha256:746eb355…fa42e). Ne pas repasser à latest.
- name: ghcr.io/fabianch/poc-ai4ops/ia4ops-agent-chat
  newTag: sha-b94dda4
labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: ia4ops-agent-chat
    app.kubernetes.io/instance: ia4ops-agent-chat
resources:
- ia4ops-agent-chat-namespace.yaml
- ia4ops-agent-chat-serviceaccount.yaml
- ia4ops-agent-chat-role.yaml
- ia4ops-agent-chat-rolebinding.yaml
- ia4ops-agent-chat-pvc.yaml
- ia4ops-agent-chat-deployment.yaml
- ia4ops-agent-chat-service.yaml
- ia4ops-agent-chat-networkpolicy.yaml
