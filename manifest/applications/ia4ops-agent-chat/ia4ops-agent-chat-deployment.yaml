apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia4ops-agent-chat
  namespace: ia4ops-agent-chat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia4ops-agent-chat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ia4ops-agent-chat
        image: ghcr.io/fabianch/poc-ai4ops/ia4ops-agent-chat
        imagePullPolicy: Always
        env:
        - name: LLM_PROVIDER
          value: gemini
        - name: REQUEST_INTERPRETER_PROVIDER
          value: gemini
        - name: REQUEST_INTERPRETER_MODEL
          value: gemini-2.5-flash
        - name: DATA_PROVIDER
          value: real
        - name: LLM_MODEL
          value: gemini-2.5-flash
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "true"
        - name: GOOGLE_CLOUD_PROJECT
          value: wavestone-cto-ai4ops
        - name: GOOGLE_CLOUD_LOCATION
          value: europe-west1
        - name: VERTEX_AI_LOCATION
          value: europe-west1
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/secrets/google/credentials.json
        - name: GRAFANA_BASE_URL
          value: https://grafana.34.140.119.20.sslip.io
        - name: GRAFANA_USERNAME
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: username
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: password
        - name: AUDIT_DIR
          value: /app/audit_logs
        - name: HOME
          value: /tmp
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: audit
          mountPath: /app/audit_logs
        - name: chainlit-files
          mountPath: /app/.files
        - name: chainlit-translations
          mountPath: /app/.chainlit/translations
        - name: gemini-credentials
          mountPath: /var/run/secrets/google
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: audit
        persistentVolumeClaim:
          claimName: ia4ops-agent-chat-audit
      - name: chainlit-files
        emptyDir: {}
      - name: chainlit-translations
        emptyDir: {}
      - name: gemini-credentials
        secret:
          secretName: ia4ops-agent-chat-gemini
          items:
          - key: credentials.json
            path: credentials.json
      - name: tmp
        emptyDir: {}
