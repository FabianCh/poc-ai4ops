apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ia4ops-agent-chat
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Le port-forward n'est pas soumis aux NetworkPolicies ; seul Alertmanager peut
# joindre le webhook depuis le réseau du cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-webhook
  namespace: ia4ops-agent-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent-chat
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: ia4ops-agent-chat
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# Autoriser le DNS du cluster ; les appels HTTPS vers Grafana et Vertex AI sont listés
# séparément ci-dessous.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: ia4ops-agent-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent-chat
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Les endpoints Google Vertex AI et Grafana sont externes. NetworkPolicy standard ne gère pas
# les FQDN : l'egress est limité à HTTPS (et DNS ci-dessus), sans accès HTTP arbitraire.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: ia4ops-agent-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent-chat
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 443
---
# Lecture de l'API Kubernetes (k3s écoute sur 6443 ; la politique est évaluée après la
# traduction du Service kubernetes.default vers l'IP du nœud). Limité à ce port : les droits
# effectifs sont ceux, en lecture seule, du Role ia4ops-agent-chat-reader dans otel-demo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubernetes-api-egress
  namespace: ia4ops-agent-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent-chat
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 6443
