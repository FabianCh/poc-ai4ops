---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-whoami
images:
- name: traefik/whoami
  newTag: v1.10
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: demo-whoami
    app.kubernetes.io/name: whoami
resources:
- demo-whoami-namespace.yaml
- demo-whoami-deployment.yaml
- demo-whoami-service.yaml
- demo-whoami-ingress.yaml
