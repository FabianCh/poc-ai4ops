---
# Agent IA de diagnostic (lecture seule) : reçoit les webhooks Alertmanager.
# LLM conservé en mock ; métriques et logs collectés via Grafana.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia4ops-agent
  namespace: ia4ops
spec:
  replicas: 1
  # 1 seul réplica (cache de déduplication en mémoire) et PVC RWO : pas de rolling update
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia4ops-agent
    spec:
      # Les données sont collectées via Grafana ; aucun accès à l'API Kubernetes nécessaire.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ia4ops-agent
        image: ghcr.io/fabianch/poc-ai4ops/ia4ops-agent
        env:
        - name: LLM_PROVIDER
          value: mock
        - name: DATA_PROVIDER
          value: real
        - name: GRAFANA_BASE_URL
          value: https://grafana.34.140.119.20.sslip.io
        - name: GRAFANA_USERNAME
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: username
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: password
        # Retour agent -> Keep (incidents, alertes associées, commentaires). URL interne du
        # backend (sans préfixe /v2, qui n'existe que sur l'Ingress public). La clé d'API
        # (rôle admin de Keep) est créée par `make create-keep-secrets`, jamais dans Git ;
        # optionnelle : sans elle l'agent démarre sans le retour vers Keep.
        - name: KEEP_API_BASE_URL
          value: http://keep-backend.keep.svc:8080
        - name: KEEP_API_KEY
          valueFrom:
            secretKeyRef:
              name: ia4ops-agent-keep
              key: KEEP_API_KEY
              optional: true
        - name: AUDIT_DIR
          value: /app/audit_logs
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/google/service-account.json
        - name: GOOGLE_CLOUD_PROJECT
          value: wavestone-cto-ai4ops
        - name: VERTEX_AI_LOCATION
          value: europe-west1
        - name: LLM_MODEL
          value: gemini-2.5-flash
        # Racine en lecture seule et utilisateur sans home : caches éventuels dans /tmp
        - name: HOME
          value: /tmp
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: audit
          mountPath: /app/audit_logs
        - name: tmp
          mountPath: /tmp
        - name: google-credentials
          mountPath: /var/run/google
          readOnly: true
      volumes:
      - name: audit
        persistentVolumeClaim:
          claimName: ia4ops-agent-audit
      - name: tmp
        emptyDir: {}
      - name: google-credentials
        secret:
          secretName: model-garden-credentials
          defaultMode: 0440
          items:
          - key: service-account.json
            path: service-account.json
