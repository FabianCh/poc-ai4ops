---
# Agent IA de diagnostic (lecture seule) : reçoit les webhooks Alertmanager.
# Mode actuel : LLM et providers de données mockés. Gemini pourra être activé séparément
# une fois le compte de service monté ; les providers Prometheus/Loki/Kubernetes sont incomplets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia4ops-agent
  namespace: ia4ops
spec:
  replicas: 1
  # 1 seul réplica (cache de déduplication en mémoire) et PVC RWO : pas de rolling update
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ia4ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia4ops-agent
    spec:
      # Aucun accès à l'API Kubernetes nécessaire (providers mockés)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ia4ops-agent
        image: ghcr.io/fabianch/poc-ai4ops/ia4ops-agent
        env:
        - name: LLM_PROVIDER
          value: mock
        - name: DATA_PROVIDER
          value: mock
        - name: AUDIT_DIR
          value: /app/audit_logs
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/google/service-account.json
        - name: GOOGLE_CLOUD_PROJECT
          value: wavestone-cto-ai4ops
        - name: VERTEX_AI_LOCATION
          value: europe-west1
        - name: LLM_MODEL
          value: gemini-2.0-flash
        # Racine en lecture seule et utilisateur sans home : caches éventuels dans /tmp
        - name: HOME
          value: /tmp
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: audit
          mountPath: /app/audit_logs
        - name: tmp
          mountPath: /tmp
        - name: google-credentials
          mountPath: /var/run/google
          readOnly: true
      volumes:
      - name: audit
        persistentVolumeClaim:
          claimName: ia4ops-agent-audit
      - name: tmp
        emptyDir: {}
      - name: google-credentials
        secret:
          secretName: model-garden-credentials
          defaultMode: 0440
          items:
          - key: service-account.json
            path: service-account.json
