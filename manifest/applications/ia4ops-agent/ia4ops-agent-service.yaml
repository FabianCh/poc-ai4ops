---
# Interne au cluster uniquement (pas d'Ingress). Consultation des incidents :
#   kubectl -n ia4ops port-forward svc/ia4ops-agent 8000
apiVersion: v1
kind: Service
metadata:
  name: ia4ops-agent
  namespace: ia4ops
spec:
  selector:
    app.kubernetes.io/name: ia4ops-agent
  ports:
  - name: http
    port: 8000
    targetPort: http
