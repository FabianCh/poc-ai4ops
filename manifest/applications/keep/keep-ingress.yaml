---
# Mêmes chemins que l'Ingress Traefik du chart, avec TLS cert-manager :
#   /          interface (frontend)   /v2         API backend (préfixe retiré par le Middleware)
#   /websocket mises à jour en direct (soketi, préfixe retiré)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keep
  namespace: keep
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: keep-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - keep.${INGRESS_BASE_DOMAIN}
    secretName: keep-tls
  rules:
  - host: keep.${INGRESS_BASE_DOMAIN}
    http:
      paths:
      - path: /websocket
        pathType: Prefix
        backend:
          service:
            name: keep-websocket
            port:
              number: 6001
      - path: /v2
        pathType: Prefix
        backend:
          service:
            name: keep-backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keep-frontend
            port:
              number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: keep
spec:
  stripPrefix:
    prefixes:
    - /v2
    - /websocket
