---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kube-prometheus-stack

    # Composants du control plane embarqués dans le binaire k3s : pas de
    # endpoints dédiés à scraper, ils généreraient des alertes en permanence.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 9GB
        # Découvre tous les ServiceMonitors / PodMonitors / règles du cluster,
        # pas seulement ceux portant le label de la release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # Réception des métriques OTLP (OpenTelemetry Collector de la démo otel-demo)
        enableOTLPReceiver: true
        enableFeatures:
        - exemplar-storage
        tsdb:
          outOfOrderTimeWindow: 30m
        otlp:
          keepIdentifyingResourceAttributes: true
          promoteResourceAttributes:
          - service.instance.id
          - service.name
          - service.namespace
          - service.version
          - deployment.environment.name
          - k8s.container.name
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.name
          - container.name
          - host.name
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      # Config par défaut (receiver "null") : le webhook de l'agent
      # d'auto-remédiation sera branché ici plus tard.
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

    grafana:
      # Pas d'adminPassword : le chart génère un mot de passe aléatoire dans le
      # secret kube-prometheus-stack-grafana (le repo est public).
      adminUser: admin
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
        - grafana.${INGRESS_BASE_DOMAIN}
        tls:
        - hosts:
          - grafana.${INGRESS_BASE_DOMAIN}
          secretName: grafana-tls
      additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        jsonData:
          maxLines: 1000
      # Datasources attendues (par uid) par les dashboards de l'OpenTelemetry Demo
      - name: Jaeger
        type: jaeger
        uid: webstore-traces
        access: proxy
        url: http://jaeger.otel-demo.svc:16686/jaeger/ui
      - name: Prometheus (otel-demo)
        type: prometheus
        uid: webstore-metrics
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        jsonData:
          exemplarTraceIdDestinations:
          - datasourceUid: webstore-traces
            name: trace_id
      # Dashboards de l'OpenTelemetry Demo, téléchargés au démarrage de Grafana.
      # Garder le tag aligné sur la version du chart (manifest/applications/otel-demo).
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: otel-demo
            orgId: 1
            folder: OpenTelemetry Demo
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/otel-demo
      dashboards:
        otel-demo:
          demo-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/demo-dashboard.json
          apm-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/apm-dashboard.json
          spanmetrics-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/spanmetrics-dashboard.json
          exemplars-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/exemplars-dashboard.json
          opentelemetry-collector:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/opentelemetry-collector.json
          nginx-metrics:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/NGINX-metrics.json
          postgresql-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/postgresql-dashboard.json
          linux-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/linux-dashboard.json
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
