---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kube-prometheus-stack

    # Composants du control plane embarqués dans le binaire k3s : pas de
    # endpoints dédiés à scraper, ils généreraient des alertes en permanence.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 9GB
        # Découvre tous les ServiceMonitors / PodMonitors / règles du cluster,
        # pas seulement ceux portant le label de la release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # Réception des métriques OTLP (OpenTelemetry Collector de la démo otel-demo)
        enableOTLPReceiver: true
        enableFeatures:
        - exemplar-storage
        tsdb:
          outOfOrderTimeWindow: 30m
        otlp:
          keepIdentifyingResourceAttributes: true
          promoteResourceAttributes:
          - service.instance.id
          - service.name
          - service.namespace
          - service.version
          - deployment.environment.name
          - k8s.container.name
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.name
          - container.name
          - host.name
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      # Routage : toutes les alertes (sauf Watchdog) sont envoyées à Keep (console d'alertes,
      # namespace keep) puis, pour le namespace otel-demo, à l'agent ia4ops-agent (webhook
      # Alertmanager v4) ; le reste va au receiver "null". route et receivers remplacent ceux
      # du chart (les listes Helm ne fusionnent pas) ; inhibit_rules et global restent ceux
      # par défaut.
      config:
        route:
          group_by: [namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
          - receiver: "null"
            matchers:
            - alertname = "Watchdog"
          # continue: l'alerte est aussi évaluée par la route suivante (agent). Keep déduplique
          # lui-même par fingerprint : group_by large et group_interval court (résolution rapide).
          - receiver: keep
            matchers:
            - alertname != "Watchdog"
            group_by: [namespace, alertname]
            group_wait: 10s
            group_interval: 1m
            repeat_interval: 4h
            continue: true
          - receiver: ia4ops-agent
            matchers:
            - namespace = "otel-demo"
            group_by: [namespace, alertname]
            repeat_interval: 4h
        receivers:
        - name: "null"
        - name: ia4ops-agent
          webhook_configs:
          - url: http://ia4ops-agent.ia4ops.svc:8000/webhooks/alertmanager
            send_resolved: true
        # Clé d'API (rôle webhook) lue dans un fichier : Secret keep-alertmanager-api-key créé
        # par `make create-keep-secrets`, jamais dans Git.
        - name: keep
          webhook_configs:
          - url: http://keep-backend.keep.svc:8080/alerts/event/prometheus
            send_resolved: true
            http_config:
              basic_auth:
                username: api_key
                password_file: /etc/alertmanager/keep-api-key/api-key
      alertmanagerSpec:
        # Volume optionnel : sans le Secret, Alertmanager démarre quand même (les envois vers
        # Keep échouent, ceux vers l'agent continuent).
        volumes:
        - name: keep-api-key
          secret:
            secretName: keep-alertmanager-api-key
            optional: true
        volumeMounts:
        - name: keep-api-key
          mountPath: /etc/alertmanager/keep-api-key
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

    grafana:
      # Pas d'adminPassword : le chart génère un mot de passe aléatoire dans le
      # secret kube-prometheus-stack-grafana (le repo est public).
      adminUser: admin
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
        - grafana.${INGRESS_BASE_DOMAIN}
        tls:
        - hosts:
          - grafana.${INGRESS_BASE_DOMAIN}
          secretName: grafana-tls
      additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        jsonData:
          maxLines: 1000
      # Datasources attendues (par uid) par les dashboards de l'OpenTelemetry Demo
      - name: Jaeger
        type: jaeger
        uid: webstore-traces
        access: proxy
        url: http://jaeger.otel-demo.svc:16686/jaeger/ui
      - name: Prometheus (otel-demo)
        type: prometheus
        uid: webstore-metrics
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        jsonData:
          exemplarTraceIdDestinations:
          - datasourceUid: webstore-traces
            name: trace_id
      # Dashboards de l'OpenTelemetry Demo, téléchargés au démarrage de Grafana.
      # Garder le tag aligné sur la version du chart (manifest/applications/otel-demo).
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: otel-demo
            orgId: 1
            folder: OpenTelemetry Demo
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/otel-demo
      dashboards:
        otel-demo:
          demo-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/demo-dashboard.json
          apm-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/apm-dashboard.json
          spanmetrics-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/spanmetrics-dashboard.json
          exemplars-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/exemplars-dashboard.json
          opentelemetry-collector:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/opentelemetry-collector.json
          nginx-metrics:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/NGINX-metrics.json
          postgresql-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/postgresql-dashboard.json
          linux-dashboard:
            url: https://raw.githubusercontent.com/open-telemetry/opentelemetry-helm-charts/opentelemetry-demo-0.42.1/charts/opentelemetry-demo/grafana/provisioning/dashboards/linux-dashboard.json
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
