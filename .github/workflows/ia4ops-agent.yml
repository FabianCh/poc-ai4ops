name: ia4ops-agent

# Tests puis build de l'image de l'agent ; publication sur GitHub Container Registry
# (ghcr.io/<owner>/poc-ai4ops/ia4ops-agent) à chaque modification du code sur main.
on:
  push:
    branches: [main]
    paths:
      - "ia4ops-agent/**"
      - ".github/workflows/ia4ops-agent.yml"
  pull_request:
    paths:
      - "ia4ops-agent/**"
      - ".github/workflows/ia4ops-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia4ops-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia4ops-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: ia4ops-agent/uv.lock
      - name: Installation (Python 3.14, dépendances verrouillées)
        run: uv sync --locked --extra dev --python 3.14 --managed-python
      - name: Tests (hors tests/live)
        run: uv run pytest -q

  image:
    name: Build & publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action passe le nom en minuscules (exigé par ghcr.io)
          images: ghcr.io/${{ github.repository }}/ia4ops-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build (et push sur main)
        uses: docker/build-push-action@v6
        with:
          context: ia4ops-agent
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
